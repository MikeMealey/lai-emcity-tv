<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#020703">
  <title>Emerald City</title>
  <style>
    :root { color-scheme: dark; background:#020703; }
    * { box-sizing:border-box; }
    html,body { width:100%; height:100%; margin:0; overflow:hidden; background:#020703; }
    body { position:relative; }

    .scene {
      position:fixed;
      inset:-3%;
      background:
        linear-gradient(rgba(0,18,5,.06),rgba(0,8,3,.10)),
        url("emerald-city-4k.jpg") center/cover no-repeat;
      transform:scale(1.035);
      animation:cameraDrift 42s ease-in-out infinite alternate;
      will-change:transform,filter;
    }

    .mist, .mist::before, .mist::after,
    .steam1, .steam2, .road-glow, .lamp-pulse, .vignette {
      position:fixed;
      pointer-events:none;
    }

    /* Broad atmospheric movement across the tunnel */
    .mist { inset:-10%; overflow:hidden; mix-blend-mode:screen; opacity:.34; }
    .mist::before,
    .mist::after {
      content:"";
      position:absolute;
      inset:-10%;
      background:
        radial-gradient(ellipse at 79% 30%, rgba(196,255,204,.18) 0 5%, rgba(143,236,158,.08) 13%, transparent 31%),
        radial-gradient(ellipse at 60% 39%, rgba(169,255,181,.10) 0 6%, transparent 25%),
        radial-gradient(ellipse at 44% 29%, rgba(140,230,151,.06) 0 5%, transparent 23%);
      filter:blur(34px);
      animation:mistDrift 31s ease-in-out infinite alternate;
      will-change:transform,opacity;
    }
    .mist::after {
      transform:scaleX(-1);
      opacity:.65;
      animation-duration:47s;
      animation-delay:-13s;
    }

    /* Two visible but slow steam plumes near the right side */
    .steam1, .steam2 {
      width:26vw; height:34vh;
      right:-4vw; top:18vh;
      border-radius:50%;
      background:radial-gradient(ellipse, rgba(205,255,213,.18) 0%, rgba(166,245,180,.08) 38%, transparent 72%);
      filter:blur(28px);
      mix-blend-mode:screen;
      opacity:.30;
      animation:steamRise 19s ease-in-out infinite;
      will-change:transform,opacity;
    }
    .steam2 {
      width:20vw; height:28vh;
      right:18vw; top:30vh;
      opacity:.18;
      animation-duration:27s;
      animation-delay:-9s;
    }

    /* Moving reflection over the lower roadway */
    .road-glow {
      left:-18%; right:-18%; bottom:-4%; height:48%;
      background:linear-gradient(106deg,
        transparent 0 28%,
        rgba(118,255,148,.02) 35%,
        rgba(193,255,204,.10) 44%,
        rgba(226,255,231,.06) 49%,
        transparent 58% 100%);
      filter:blur(9px);
      mix-blend-mode:screen;
      opacity:.38;
      animation:roadShimmer 16s ease-in-out infinite alternate;
      will-change:transform,opacity;
    }

    /* Irregular fluorescent brightness pulses */
    .lamp-pulse {
      inset:0;
      background:
        radial-gradient(circle at 8% 8%, rgba(235,255,238,.10), transparent 8%),
        radial-gradient(circle at 38% 17%, rgba(235,255,238,.08), transparent 6%),
        radial-gradient(circle at 73% 17%, rgba(235,255,238,.06), transparent 6%),
        radial-gradient(circle at 89% 12%, rgba(235,255,238,.05), transparent 6%);
      mix-blend-mode:screen;
      opacity:.10;
      animation:lampFlicker 17s steps(1,end) infinite;
    }

    .vignette {
      inset:0;
      background:
        radial-gradient(ellipse at center, transparent 44%, rgba(0,0,0,.13) 68%, rgba(0,0,0,.48) 100%),
        linear-gradient(to bottom, rgba(0,0,0,.08), transparent 22%, transparent 75%, rgba(0,0,0,.18));
    }

    @keyframes cameraDrift {
      0%   { transform:scale(1.035) translate3d(-.35%, .05%, 0); filter:brightness(.97) saturate(1.02); }
      100% { transform:scale(1.045) translate3d(.35%, -.18%, 0); filter:brightness(1.015) saturate(1.06); }
    }
    @keyframes mistDrift {
      0%   { transform:translate3d(-4%, 1.5%, 0) scale(1.00); opacity:.42; }
      50%  { transform:translate3d(0%, -.5%, 0) scale(1.04); opacity:.66; }
      100% { transform:translate3d(4%, -1.8%, 0) scale(1.07); opacity:.48; }
    }
    @keyframes steamRise {
      0%   { transform:translate3d(0, 8vh, 0) scale(.85); opacity:.05; }
      28%  { opacity:.32; }
      70%  { opacity:.22; }
      100% { transform:translate3d(-7vw, -10vh, 0) scale(1.28); opacity:0; }
    }
    @keyframes roadShimmer {
      0%   { transform:translate3d(-5%, 0, 0) skewX(-2deg); opacity:.22; }
      100% { transform:translate3d(6%, 0, 0) skewX(2deg); opacity:.48; }
    }
    @keyframes lampFlicker {
      0%,5%,7%,8%,27%,29%,54%,56%,73%,75%,91%,93%,100% { opacity:.10; }
      6%,28%,55%,74%,92% { opacity:.34; }
      6.35%,28.25%,55.25%,74.3%,92.2% { opacity:.035; }
    }
  </style>
</head>
<body aria-label="Emerald City ambient underground scene">
  <div class="scene" aria-hidden="true"></div>
  <div class="mist" aria-hidden="true"></div>
  <div class="steam1" aria-hidden="true"></div>
  <div class="steam2" aria-hidden="true"></div>
  <div class="road-glow" aria-hidden="true"></div>
  <div class="lamp-pulse" aria-hidden="true"></div>
  <div class="vignette" aria-hidden="true"></div>
</body>
</html>
