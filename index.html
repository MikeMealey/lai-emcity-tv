<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#020703">
  <title>Emerald City</title>
  <style>
    :root { color-scheme: dark; background:#020703; }
    * { box-sizing:border-box; }
    html,body { width:100%; height:100%; margin:0; overflow:hidden; background:#020703; }
    body { position:relative; }

    .scene {
      position:fixed;
      inset:0;
      background:
        linear-gradient(rgba(0,18,5,.05),rgba(0,8,3,.08)),
        url("emerald-city-4k.jpg") center/cover no-repeat;
    }

    .mist, .mist::before, .mist::after,
    .steam1, .steam2, .steam3, .road-glow, .lamp-pulse, .vignette {
      position:fixed;
      pointer-events:none;
    }

    .mist { inset:-8%; overflow:hidden; mix-blend-mode:screen; opacity:.28; }
    .mist::before,
    .mist::after {
      content:"";
      position:absolute;
      inset:-8%;
      background:
        radial-gradient(ellipse at 79% 30%, rgba(196,255,204,.16) 0 5%, rgba(143,236,158,.07) 13%, transparent 31%),
        radial-gradient(ellipse at 60% 39%, rgba(169,255,181,.09) 0 6%, transparent 25%);
      filter:blur(30px);
      animation:mistDrift 18s ease-in-out infinite alternate;
      will-change:transform,opacity;
    }
    .mist::after {
      transform:scaleX(-1);
      opacity:.55;
      animation-duration:24s;
      animation-delay:-7s;
    }

    .steam1, .steam2, .steam3 {
      border-radius:50%;
      background:radial-gradient(ellipse, rgba(220,255,225,.28) 0%, rgba(166,245,180,.13) 38%, transparent 72%);
      filter:blur(24px);
      mix-blend-mode:screen;
      will-change:transform,opacity;
    }
    .steam1 {
      width:24vw; height:30vh; right:-3vw; top:22vh;
      animation:steamRiseA 8.5s ease-out infinite;
    }
    .steam2 {
      width:18vw; height:24vh; right:11vw; top:34vh;
      animation:steamRiseB 11s ease-out infinite;
      animation-delay:-4s;
    }
    .steam3 {
      width:14vw; height:19vh; right:2vw; top:43vh;
      animation:steamRiseC 7.2s ease-out infinite;
      animation-delay:-2.5s;
    }

    .road-glow {
      left:-16%; right:-16%; bottom:-3%; height:46%;
      background:linear-gradient(106deg,
        transparent 0 28%,
        rgba(118,255,148,.03) 35%,
        rgba(193,255,204,.12) 44%,
        rgba(226,255,231,.07) 49%,
        transparent 58% 100%);
      filter:blur(8px);
      mix-blend-mode:screen;
      opacity:.34;
      animation:roadShimmer 9s ease-in-out infinite alternate;
      will-change:transform,opacity;
    }

    .lamp-pulse {
      inset:0;
      background:
        radial-gradient(circle at 8% 8%, rgba(235,255,238,.11), transparent 8%),
        radial-gradient(circle at 38% 17%, rgba(235,255,238,.09), transparent 6%),
        radial-gradient(circle at 73% 17%, rgba(235,255,238,.07), transparent 6%),
        radial-gradient(circle at 89% 12%, rgba(235,255,238,.06), transparent 6%);
      mix-blend-mode:screen;
      opacity:.10;
      animation:lampFlicker 13s steps(1,end) infinite;
    }

    .vignette {
      inset:0;
      background:
        radial-gradient(ellipse at center, transparent 44%, rgba(0,0,0,.13) 68%, rgba(0,0,0,.48) 100%),
        linear-gradient(to bottom, rgba(0,0,0,.08), transparent 22%, transparent 75%, rgba(0,0,0,.18));
    }

    @keyframes mistDrift {
      0%   { transform:translate3d(-2.5%, 1%, 0) scale(1.00); opacity:.38; }
      50%  { transform:translate3d(0%, -.3%, 0) scale(1.025); opacity:.56; }
      100% { transform:translate3d(2.5%, -1%, 0) scale(1.04); opacity:.42; }
    }
    @keyframes steamRiseA {
      0%   { transform:translate3d(0, 7vh, 0) scale(.72); opacity:0; }
      18%  { opacity:.42; }
      58%  { opacity:.30; }
      100% { transform:translate3d(-6vw, -13vh, 0) scale(1.34); opacity:0; }
    }
    @keyframes steamRiseB {
      0%   { transform:translate3d(0, 6vh, 0) scale(.78); opacity:0; }
      22%  { opacity:.34; }
      64%  { opacity:.24; }
      100% { transform:translate3d(-4vw, -10vh, 0) scale(1.25); opacity:0; }
    }
    @keyframes steamRiseC {
      0%   { transform:translate3d(0, 5vh, 0) scale(.68); opacity:0; }
      20%  { opacity:.30; }
      60%  { opacity:.18; }
      100% { transform:translate3d(-3vw, -8vh, 0) scale(1.18); opacity:0; }
    }
    @keyframes roadShimmer {
      0%   { transform:translate3d(-3.5%, 0, 0) skewX(-1deg); opacity:.24; }
      100% { transform:translate3d(4%, 0, 0) skewX(1deg); opacity:.44; }
    }
    @keyframes lampFlicker {
      0%,5%,7%,8%,27%,29%,54%,56%,73%,75%,91%,93%,100% { opacity:.10; }
      6%,28%,55%,74%,92% { opacity:.36; }
      6.35%,28.25%,55.25%,74.3%,92.2% { opacity:.03; }
    }
  </style>
</head>
<body aria-label="Emerald City ambient underground scene">
  <div class="scene" aria-hidden="true"></div>
  <div class="mist" aria-hidden="true"></div>
  <div class="steam1" aria-hidden="true"></div>
  <div class="steam2" aria-hidden="true"></div>
  <div class="steam3" aria-hidden="true"></div>
  <div class="road-glow" aria-hidden="true"></div>
  <div class="lamp-pulse" aria-hidden="true"></div>
  <div class="vignette" aria-hidden="true"></div>
</body>
</html>
