<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#020703">
  <title>Emerald City</title>
  <style>
    :root {
      color-scheme: dark;
      background: #020703;
    }

    * { box-sizing: border-box; }

    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #020703;
    }

    body {
      position: relative;
      font-family: system-ui, sans-serif;
    }

    .scene {
      position: fixed;
      inset: -1.5%;
      background:
        linear-gradient(rgba(0, 18, 5, 0.08), rgba(0, 8, 3, 0.12)),
        url("emerald-city-4k.jpg") center center / cover no-repeat;
      transform: scale(1.015);
      animation: breathe 34s ease-in-out infinite alternate;
      will-change: transform, filter;
    }

    .haze,
    .haze::before,
    .haze::after,
    .sheen,
    .flicker,
    .vignette {
      position: fixed;
      inset: 0;
      pointer-events: none;
    }

    .haze {
      overflow: hidden;
      mix-blend-mode: screen;
      opacity: 0.25;
    }

    .haze::before,
    .haze::after {
      content: "";
      inset: -15%;
      filter: blur(38px);
      background:
        radial-gradient(circle at 74% 26%, rgba(185, 255, 194, 0.17), transparent 15%),
        radial-gradient(circle at 62% 39%, rgba(145, 255, 168, 0.09), transparent 18%),
        radial-gradient(circle at 47% 31%, rgba(135, 235, 158, 0.06), transparent 22%);
      animation: hazeDrift 44s ease-in-out infinite alternate;
    }

    .haze::after {
      opacity: 0.58;
      transform: scaleX(-1);
      animation-duration: 61s;
      animation-delay: -17s;
    }

    .sheen {
      inset: auto -12% -5% -12%;
      height: 49%;
      mix-blend-mode: screen;
      opacity: 0.18;
      filter: blur(13px);
      background:
        linear-gradient(108deg,
          transparent 0 31%,
          rgba(168, 255, 185, 0.03) 37%,
          rgba(212, 255, 218, 0.08) 45%,
          transparent 53% 100%);
      animation: roadSheen 29s ease-in-out infinite alternate;
    }

    .flicker {
      background:
        radial-gradient(circle at 12% 7%, rgba(225,255,225,.07), transparent 7%),
        radial-gradient(circle at 39% 18%, rgba(225,255,225,.045), transparent 5%),
        radial-gradient(circle at 73% 17%, rgba(225,255,225,.035), transparent 5%);
      mix-blend-mode: screen;
      opacity: .12;
      animation: fluorescentFlicker 23s steps(1, end) infinite;
    }

    .vignette {
      background:
        radial-gradient(ellipse at center,
          transparent 45%,
          rgba(0, 0, 0, 0.16) 70%,
          rgba(0, 0, 0, 0.48) 100%),
        linear-gradient(to bottom, rgba(0,0,0,.08), transparent 22%, transparent 72%, rgba(0,0,0,.14));
    }

    @keyframes breathe {
      from { transform: scale(1.015) translate3d(-0.1%, 0, 0); filter: brightness(0.98); }
      to   { transform: scale(1.022) translate3d(0.15%, -0.08%, 0); filter: brightness(1.01); }
    }

    @keyframes hazeDrift {
      0%   { transform: translate3d(-2.0%, 1.0%, 0) scale(1.00); opacity: .42; }
      45%  { transform: translate3d(0.8%, -0.2%, 0) scale(1.03); opacity: .56; }
      100% { transform: translate3d(2.4%, -1.1%, 0) scale(1.05); opacity: .47; }
    }

    @keyframes roadSheen {
      from { transform: translate3d(-1.4%, 0, 0); opacity: .11; }
      to   { transform: translate3d(2.2%, 0, 0); opacity: .22; }
    }

    @keyframes fluorescentFlicker {
      0%, 7%, 9%, 10%, 37%, 39%, 62%, 64%, 83%, 85%, 100% { opacity: .10; }
      8%, 38%, 63%, 84% { opacity: .27; }
      8.3%, 38.2%, 63.3%, 84.2% { opacity: .04; }
    }

    @media (prefers-reduced-motion: reduce) {
      .scene, .haze::before, .haze::after, .sheen, .flicker { animation: none; }
    }
  </style>
</head>
<body aria-label="Emerald City ambient underground scene">
  <div class="scene" aria-hidden="true"></div>
  <div class="haze" aria-hidden="true"></div>
  <div class="sheen" aria-hidden="true"></div>
  <div class="flicker" aria-hidden="true"></div>
  <div class="vignette" aria-hidden="true"></div>
</body>
</html>
