<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#020703">
  <title>Emerald City</title>
  <style>
    * { box-sizing:border-box; }
    html,body { width:100%; height:100%; margin:0; overflow:hidden; background:#020703; }
    body { position:relative; }
    .scene {
      position:fixed; inset:0;
      background:
        linear-gradient(rgba(0,18,5,.05),rgba(0,8,3,.08)),
        url("emerald-city-4k.jpg") center/cover no-repeat;
    }
    #steamCanvas { position:fixed; inset:0; width:100%; height:100%; pointer-events:none; }
    .road-glow {
      position:fixed; left:-18%; right:-18%; bottom:-2%; height:44%; pointer-events:none;
      background:linear-gradient(106deg, transparent 0 27%, rgba(125,255,150,.02) 34%, rgba(205,255,215,.10) 44%, rgba(235,255,238,.055) 50%, transparent 59% 100%);
      opacity:.32;
      animation:roadShimmer 7s ease-in-out infinite alternate;
      will-change:transform,opacity;
    }
    .lamp-pulse {
      position:fixed; inset:0; pointer-events:none;
      background:
        radial-gradient(circle at 8% 8%, rgba(235,255,238,.11), transparent 8%),
        radial-gradient(circle at 38% 17%, rgba(235,255,238,.09), transparent 6%),
        radial-gradient(circle at 73% 17%, rgba(235,255,238,.07), transparent 6%),
        radial-gradient(circle at 89% 12%, rgba(235,255,238,.06), transparent 6%);
      opacity:.10;
      animation:lampFlicker 13s steps(1,end) infinite;
    }
    .vignette {
      position:fixed; inset:0; pointer-events:none;
      background:radial-gradient(ellipse at center, transparent 45%, rgba(0,0,0,.15) 70%, rgba(0,0,0,.46) 100%);
    }
    #debug {
      display:none; position:fixed; left:14px; top:14px; z-index:20;
      padding:8px 10px; background:rgba(0,0,0,.75); color:#c9ffd3;
      font:14px/1.3 system-ui,sans-serif; border:1px solid rgba(201,255,211,.35); border-radius:6px;
    }
    body.debug #debug { display:block; }
    @keyframes roadShimmer {
      from { transform:translateX(-2.5%); opacity:.25; }
      to   { transform:translateX(3.5%); opacity:.42; }
    }
    @keyframes lampFlicker {
      0%,5%,7%,8%,27%,29%,54%,56%,73%,75%,91%,93%,100% { opacity:.10; }
      6%,28%,55%,74%,92% { opacity:.34; }
      6.35%,28.25%,55.25%,74.3%,92.2% { opacity:.03; }
    }
  </style>
</head>
<body aria-label="Emerald City ambient underground scene">
  <div class="scene" aria-hidden="true"></div>
  <canvas id="steamCanvas" aria-hidden="true"></canvas>
  <div class="road-glow" aria-hidden="true"></div>
  <div class="lamp-pulse" aria-hidden="true"></div>
  <div class="vignette" aria-hidden="true"></div>
  <div id="debug">Steam animation: <strong>RUNNING</strong><br><span id="fps">0</span> fps</div>

  <script>
  (() => {
    const canvas = document.getElementById('steamCanvas');
    const ctx = canvas.getContext('2d');
    const fpsEl = document.getElementById('fps');
    const debugMode = new URLSearchParams(location.search).has('debug');
    if (debugMode) document.body.classList.add('debug');

    let dpr = Math.min(window.devicePixelRatio || 1, 2);
    let w = 0, h = 0;
    const particles = [];
    const COUNT = 28;

    function resize() {
      w = window.innerWidth;
      h = window.innerHeight;
      dpr = Math.min(window.devicePixelRatio || 1, 2);
      canvas.width = Math.round(w * dpr);
      canvas.height = Math.round(h * dpr);
      canvas.style.width = w + 'px';
      canvas.style.height = h + 'px';
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    }

    function reset(p, initial = false) {
      p.x = w * (0.72 + Math.random() * 0.27);
      p.y = h * (0.48 + Math.random() * 0.18);
      if (initial) p.y -= Math.random() * h * 0.30;
      p.r = Math.max(28, w * (0.018 + Math.random() * 0.024));
      p.speed = Math.max(24, h * (0.030 + Math.random() * 0.026));
      p.drift = (-0.16 + Math.random() * 0.32) * p.speed;
      p.alpha = 0.035 + Math.random() * 0.070;
      p.phase = Math.random() * Math.PI * 2;
    }

    function init() {
      particles.length = 0;
      for (let i = 0; i < COUNT; i++) {
        const p = {};
        reset(p, true);
        particles.push(p);
      }
    }

    let last = performance.now();
    let fpsLast = last, frames = 0;

    function draw(now) {
      const dt = Math.min((now - last) / 1000, 0.05);
      last = now;
      ctx.clearRect(0, 0, w, h);

      for (const p of particles) {
        p.phase += dt * 0.7;
        p.y -= p.speed * dt;
        p.x += (p.drift + Math.sin(p.phase) * 7) * dt;
        p.r += dt * 5.5;

        const progress = Math.max(0, Math.min(1, (h * 0.68 - p.y) / (h * 0.46)));
        const fade = Math.sin(Math.PI * Math.min(progress, 1));
        const a = p.alpha * Math.max(0.18, fade);

        const g = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, p.r);
        g.addColorStop(0, `rgba(218,255,224,${a})`);
        g.addColorStop(0.45, `rgba(170,238,182,${a * 0.55})`);
        g.addColorStop(1, 'rgba(145,220,160,0)');
        ctx.fillStyle = g;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
        ctx.fill();

        if (p.y < h * 0.18 || p.x < w * 0.55 || p.x > w * 1.08) reset(p);
      }

      if (debugMode) {
        frames++;
        if (now - fpsLast > 1000) {
          fpsEl.textContent = Math.round(frames * 1000 / (now - fpsLast));
          frames = 0;
          fpsLast = now;
        }
      }
      requestAnimationFrame(draw);
    }

    window.addEventListener('resize', () => { resize(); init(); });
    resize();
    init();
    requestAnimationFrame(draw);
  })();
  </script>
</body>
</html>
